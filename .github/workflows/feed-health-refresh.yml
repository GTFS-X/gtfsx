# Feed Health Dashboard — monthly data refresh.
#
# Runs on the 5th of each month at 06:00 UTC (a few days after GTFS-X/gtfs-feed-health's
# own monthly refresh, so its canonical export has already updated by the time this runs).
# Also triggerable manually via workflow_dispatch.
#
# Steps:
#   1. Publish: scripts/feed-health-publish.py resolves GTFS-X/gtfs-feed-health's `main`
#      to a commit SHA, fetches exports/feed_health.json from that content-addressed
#      raw URL, runs its drift guard against the export's own nationalAggregates, and
#      writes per-state agency JSONs + regenerates fh-data.js + provenance.json.
#   2. Commit + push ONLY the public output files → Cloudflare Workers Builds auto-deploys
#
# 2026-07-31: this workflow used to run this repo's own NTD/FTA-Weblinks/Mobility-Database
# pipeline (Phase A-D, in the now-removed scripts/feed-health/) before publishing. That
# pipeline has been extracted into the standalone https://github.com/GTFS-X/gtfs-feed-health,
# which now owns it and refreshes its own export automatically on the 5th of each month.
# This workflow no longer runs any of that — it only fetches the canonical export and
# transforms it into this site's dashboard assets. Removed along with it: the
# MOBILITY_DATABASE_REFRESH_TOKEN secret usage, the reachability-cache seed/commit steps,
# and the fuzzy-review-queue artifact upload (none of that runs in this repo anymore).
#
# No Python dependencies to install: scripts/feed-health-publish.py's fetch uses only the
# stdlib (urllib) plus `gh` (pre-authenticated on GitHub Actions runners, used to resolve
# GTFS-X/gtfs-feed-health's `main` to a commit SHA — falls back to an unauthenticated
# GitHub REST call if `gh` is unavailable, e.g. when run locally without it installed).

name: Feed Health Refresh

on:
  schedule:
    - cron: '0 6 5 * *'   # 5th of every month at 06:00 UTC
  workflow_dispatch:        # manual trigger

# Prevent overlapping monthly runs
concurrency:
  group: feed-health-refresh
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  refresh:
    name: Refresh Feed Health data
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated output files

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch full history so the push step can fast-forward
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Publish — fetch canonical export, write agency JSONs + regenerate fh-data.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/feed-health-publish.py

      - name: Commit and push output files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/feed-health/data/agencies/
          git add public/feed-health/data/provenance.json
          git add public/feed-health/fh-data.js

          # Only commit if something changed
          if git diff --cached --quiet; then
            echo "No changes to commit — feed health data is up to date"
          else
            MONTH=$(date +'%B %Y')
            git commit \
              -m "chore: refresh Feed Health data for ${MONTH}" \
              -m "Auto-generated by .github/workflows/feed-health-refresh.yml. Source: GTFS-X/gtfs-feed-health canonical export."
            git push origin HEAD:main
            echo "Feed Health data committed and pushed — Cloudflare Workers Builds will deploy"
          fi
